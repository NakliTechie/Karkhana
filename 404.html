<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Karkhana — page not found</title>
    <style>
      :root {
        --kk-body:#08081a; --kk-panel:#14142a; --kk-line:#2a2040;
        --kk-ink:#f0d2a0; --kk-ink-soft:#a89868; --kk-brand:#d83858;
      }
      * { box-sizing:border-box; }
      body {
        margin:0; min-height:100vh; display:flex; align-items:center;
        justify-content:center; padding:16px;
        background:var(--kk-body); color:var(--kk-ink);
        font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        font-size:14px; line-height:1.6;
      }
      main { width:100%; max-width:560px; border:1px solid var(--kk-line);
        background:var(--kk-panel); padding:24px; }
      h1 { margin:0 0 4px; font-size:18px; font-weight:600; }
      p { margin:0 0 12px; color:var(--kk-ink-soft); }
      a { color:var(--kk-brand); }
      code { color:var(--kk-ink); }
    </style>
  </head>
  <body>
    <main>
      <h1>404 — no such page</h1>
      <p>Karkhana runs at the site root. It used to live under
      <code>/next/</code>; that path now redirects.</p>
      <p><a href="/">Open Karkhana</a></p>
    </main>
  </body>
</html>
